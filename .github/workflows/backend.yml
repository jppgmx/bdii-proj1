name: Backend e infraestrutura

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - name: Instalar backend pelo lockfile
        run: npm --prefix apps/backend ci
      - name: Testar HTTP, configuração e inicialização
        run: npm --prefix apps/backend test
      - name: Validar imagem, PostGIS e CRUD espacial
        run: bash scripts/validate-backend.sh
